[build]
  base = "apps/frontend"
  command = "yarn run build:prod"
  publish = "dist/frontend/browser"

# SPA fallback: serve index.html for any route that isn't a real file,
# so Angular's client-side router can handle deep links on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
