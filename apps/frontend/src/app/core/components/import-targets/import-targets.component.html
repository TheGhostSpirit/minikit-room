<div class="flex flex-row justify-center">
  @let fs = files();
  @for (f of fs; track f) {
    <div class="mx-2 p-2 border-primary cursor-pointer flex flex-col"
      [class]="selectedFile === f ? 'border-2 border-solid rounded' : ''"
      (click)="selectFile(f)"
    >
      <fa-icon [icon]="icons.file" size="4x" class="mx-auto" />
      <span class="font-bold">{{ getFileDateLabel(f) }}</span>
    </div>
  }
</div>
