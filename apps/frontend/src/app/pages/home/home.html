<div class="flex flex-col items-center">
  <h1 class="text-4xl font-bold mb-4">Minikit Room</h1>
  <h2 class="text-xl mb-4">Application d'archivage</h2>
  @if (profile()) {
    <span class="mb-4">Connecté en tant que {{ profile()?.name }}</span>
    <p-button label="Aller à ma pixelthèque" (click)="goToPixeltheque()" />
  }
  @else {
    <p-button label="Se connecter" (click)="login()" />
  }
</div>
