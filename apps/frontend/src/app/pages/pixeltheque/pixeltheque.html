<div class="pixeltheque-wrapper">
  <p-toolbar class="pixeltheque-header">
    <ng-template #start>
      <div>
        <h3>Pixelthèque</h3>
        <p>Ma collection de jeux</p>
      </div>
    </ng-template>
    <ng-template #center>
      <p-floatlabel variant="in">
        <input pInputText id="search" autocomplete="off" />
        <label for="search">Search</label>
      </p-floatlabel>
    </ng-template>
    <ng-template #end>
      <button pButton>
        <fa-icon [icon]="icons.plus" pButtonIcon />
        <span pButtonLabel>Add</span>
      </button>
    </ng-template>
  </p-toolbar>

  <p-table [value]="games" [tableStyle]="{ 'min-width': '100%' }">
    <ng-template #header>
      <tr>
        <th>Name</th>
        <th>Achievements</th>
        <th>Rating</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template #body let-game>
      <tr>
        <td>
          <a [routerLink]="'/game/edit/' + game.id" class="pixeltheque-link-edit">
            {{ game.name }}
          </a>
        </td>
        <td>{{ game.achievements }} / 50</td>
        <td>5.0</td>
        <td><fa-icon [icon]="icons.trash" /></td>
      </tr>
    </ng-template>
  </p-table>
</div>
