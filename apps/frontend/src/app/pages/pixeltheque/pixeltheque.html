<div class="pixeltheque-wrapper">
  <p-toolbar class="mb-8">
    <ng-template #start>
      <div>
        <h3 class="text-xl font-bold">Pixelthèque</h3>
        <p>Ma collection de jeux</p>
      </div>
    </ng-template>
    <ng-template #center>
      <p-floatlabel variant="on">
        <input pInputText id="search" autocomplete="off" disabled />
        <label for="search">Search</label>
      </p-floatlabel>
    </ng-template>
    <ng-template #end>
      <button pButton routerLink="/game/create">
        <fa-icon [icon]="icons.plus" pButtonIcon />
        <span pButtonLabel>Add</span>
      </button>
    </ng-template>
  </p-toolbar>

  <p-table [value]="(games | async) ?? []" [tableStyle]="{ 'min-width': '100%' }">
    <ng-template #header>
      <tr>
        <th>Name</th>
        <th>Platform</th>
        <th>Studio</th>
        <th>Format</th>
        <th>Rating</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template #body let-game>
      <tr>
        <td>
          <a [routerLink]="'/game/edit/' + game.id" class="pixeltheque-link-edit">
            {{ game.name }}
          </a>
        </td>
        <td>{{ game.platform }}</td>
        <td>{{ game.studio }}</td>
        <td>{{ game.format }}</td>
        <td>{{ game.rating }}</td>
        <td><fa-icon [icon]="icons.trash" /></td>
      </tr>
    </ng-template>
  </p-table>
</div>
