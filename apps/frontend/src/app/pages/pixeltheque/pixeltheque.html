<div class="pixeltheque-wrapper">
  <h1>Pixelthèque</h1>

  <p-table [value]="games" [tableStyle]="{ 'min-width': '100%' }">
    <ng-template #header>
      <tr>
        <th>Name</th>
        <th>Achievements</th>
        <th>Rating</th>
      </tr>
    </ng-template>
    <ng-template #body let-game>
      <tr>
        <td>{{ game.name }}</td>
        <td>{{ game.achievements }} / 50</td>
        <td>5.0</td>
      </tr>
    </ng-template>
  </p-table>

</div>
