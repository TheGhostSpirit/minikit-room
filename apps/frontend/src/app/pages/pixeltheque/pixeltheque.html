<div class="pixeltheque-wrapper">
  <p-toolbar>
    <ng-template #start>
      <h3>Pixelthèque</h3>
    </ng-template>
    <ng-template #end>
      <button pButton>
        <fa-icon [icon]="icons.plus" pButtonIcon />
        <span pButtonLabel>Add</span>
      </button>
    </ng-template>
  </p-toolbar>

  <p-table [value]="games" [tableStyle]="{ 'min-width': '100%' }">
    <ng-template #header>
      <tr>
        <th>Name</th>
        <th>Achievements</th>
        <th>Rating</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template #body let-game>
      <tr>
        <td>{{ game.name }}</td>
        <td>{{ game.achievements }} / 50</td>
        <td>5.0</td>
        <td><fa-icon [icon]="icons.trash" /></td>
      </tr>
    </ng-template>
  </p-table>
</div>
