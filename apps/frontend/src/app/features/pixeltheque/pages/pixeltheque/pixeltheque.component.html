<div class="pixeltheque-wrapper">
  <p-toolbar class="mb-8">
    <ng-template #start>
      <div>
        <h3 class="text-xl font-bold">Pixelthèque</h3>
        <p>Ma collection de jeux</p>
      </div>
    </ng-template>
    <ng-template #center>
      <p-floatlabel variant="on">
        <input pInputText id="search" autocomplete="off" (input)="onSearch($event.target.value)" />
        <label for="search">Search</label>
      </p-floatlabel>
    </ng-template>
    <ng-template #end>
      <button pButton routerLink="/games/create">
        <fa-icon [icon]="icons.plus" pButtonIcon />
        <span pButtonLabel>Ajouter</span>
      </button>
    </ng-template>
  </p-toolbar>

  <p-table [value]="(filteredGames$ | async) ?? []" [tableStyle]="{ 'min-width': '100%' }">
    <ng-template #header>
      <tr>
        <th>Nom</th>
        <th>Plateforme</th>
        <th>Studio</th>
        <th>Format</th>
        <th>Note</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template #body let-game>
      <tr>
        <td>
          <a [routerLink]="'/games/edit/' + game.id" class="pixeltheque-link-edit">
            {{ game.name }}
          </a>
        </td>
        <td>{{ game.platform }}</td>
        <td>{{ game.studio }}</td>
        <td>{{ game.format }}</td>
        <td>{{ game.rating }} / 5</td>
        <td>
          <a (click)="delete(game.id)" class="cursor-pointer">
            <fa-icon [icon]="icons.trash" />
          </a>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
