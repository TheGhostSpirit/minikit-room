<div>
  <p-toolbar class="mb-8">
    <ng-template #start>
      <div>
        <h3 class="text-xl font-bold">Cosmétiques Labyrinthine</h3>
        <p>Mes Cosmétiques - Total {{ cosmetics().length }}</p>
      </div>
    </ng-template>
  </p-toolbar>

  <p-dataview #dv [value]="cosmetics()">
    <ng-template #list let-items>
      <div class="flex flex-row flex-wrap justify-evenly">
        @for (item of items; track item) {
          <div>
            <img
              class="rounded-lg"
              [src]="item.icon"
              height="100"
              width="100"
            >
          </div>
        }
      </div>
    </ng-template>
  </p-dataview>
</div>
