<p-timeline [value]="commitsByDateDesc()">
  <ng-template #opposite let-commit>
    <small>{{ formatDate(commit.date) }}</small>
  </ng-template>
  <ng-template #content let-commit>
    <p-card class="mb-4 w-96">
      <div class="flex flex-col">
        @for(identifier of commit.cosmetics; track identifier.id) {
        @let cosmetic = cosmeticsById().get(identifier.id);
        <div class="flex flex-row justify-around">
          <span>{{ cosmetic?.name ?? identifier.id }}</span>
          <span class="text-primary">{{ cosmetic?.type }}</span>
        </div>
        }
      </div>
    </p-card>
  </ng-template>
</p-timeline>
