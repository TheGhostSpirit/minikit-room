<p-fileupload
  (onSelect)="onUpload($event)"
  [multiple]="true"
  accept="image/*"
  maxFileSize="10000000"
  mode="advanced"
>
</p-fileupload>

<div class="card">
  <p-galleria
    [value]="images"
    [containerStyle]="{ 'max-width': '640px' }"
    [numVisible]="5"
  >
    <ng-template #item let-item>
      <img [src]="item.itemImageSrc" style="width: 100%" />
    </ng-template>
    <ng-template #thumbnail let-item>
      <img [src]="item.itemImageSrc" />
    </ng-template>
  </p-galleria>
</div>
