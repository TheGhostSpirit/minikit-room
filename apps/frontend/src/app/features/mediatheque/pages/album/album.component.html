<div class="flex flex-col gap-4 p-4">
  <h2 class="text-2xl font-bold">{{ album()?.name }}</h2>

  <p-galleria
    [value]="imageUrls()"
    [containerStyle]="{ 'max-width': '640px' }"
    [numVisible]="5"
  >
    <ng-template #item let-url>
      <img [src]="url" style="width: 100%" />
    </ng-template>
    <ng-template #thumbnail let-url>
      <img [src]="url" />
    </ng-template>
  </p-galleria>
</div>
